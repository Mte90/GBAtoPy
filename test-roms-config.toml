# GBAtoPy Test Configuration
# Test runner configuration for all 70 ROMs (120 - 6 removed gba-tests ROMs)

roms_dir = "test_roms/roms"
output_dir = "test-reports/artifacts"
parallel = 4

# Test entries - each ROM with its test type
# Test types:
#   Smoke - Basic transpilation + Python syntax check
#   ScreenshotGolden - Compare screenshot against golden image
#   ScreenshotMgba - Use mGBA as oracle for screenshot comparison
#   EwramDump - Verify EWRAM contents match expected dump
#   PassFailScreen - Parse pass/fail text from screen
#   AssertionText - Check for assertion text in output

[[tests]]
name = "arm"
rom_path = "arm.gba"
test_type = "PassFailScreen"
pass_status = "pass"

