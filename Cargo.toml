[workspace]
members = [
    "crates/gbatopy-mgba",
    "crates/gbatopy-cli",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GBAtoPy Contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
itertools = "0.12"
rayon = "1.8"
indexmap = "2.1"
petgraph = "0.6"

# Default profile
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
